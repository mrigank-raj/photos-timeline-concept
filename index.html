<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">
<meta name="description" content="A concept for a photos timeline that understands faces, places and moments.">
<link rel="icon" href="data:,">
<title>Photos (concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint; the system font shows until Roboto arrives (or if offline). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand"><h1>Photos</h1><span class="concept">concept</span></div>
    <button class="task-btn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.4 6 14 4H5v17h2v-7h5.6l.4 2h7V6z" fill="currentColor"/></svg><span>Try a task</span></button>
    <button class="icon-btn help-btn" aria-label="How it works"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M11 18h2v-2h-2zm1-16a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-14a4 4 0 0 0-4 4h2a2 2 0 1 1 4 0c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5a4 4 0 0 0-4-4z" fill="currentColor"/></svg></button>
    <button class="avatar-btn" aria-label="Your people"><img alt=""></button>
  </header>
  <div class="task-bar" hidden>
    <button class="task-thumb" aria-label="Show the photo you are looking for"><canvas width="96" height="96"></canvas></button>
    <div class="task-text"><p class="task-note"></p><p class="task-timer" aria-live="off">0:00</p></div>
    <button class="giveup-btn">Give up</button>
  </div>
  <main class="timeline" id="timeline"></main>
</div>
<div class="scrim" hidden></div>
<section class="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="screen" id="screen" hidden></div>
<div class="toast" role="status" hidden><span class="toast-text"></span><button class="toast-undo">Undo</button></div>
<div class="peek" id="peek" hidden><canvas></canvas></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
